name: Build and publish unsigned release

on:
  push:
    branches: [main]
    paths: ['docs/RELEASE-NOTES-*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unsigned-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Select version
        id: version
        shell: pwsh
        run: |
          $note = Get-ChildItem docs/RELEASE-NOTES-*.md | Sort-Object { [version]($_.BaseName -replace '^RELEASE-NOTES-', '') } -Descending | Select-Object -First 1
          $version = $note.BaseName -replace '^RELEASE-NOTES-', ''
          "value=$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" --json tagName 2>$null
          $exists = $LASTEXITCODE -eq 0
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Synthetic core checks
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          dotnet restore tests/ChristianSpellHelper.Tests/ChristianSpellHelper.Tests.csproj --configfile NuGet.Online.Config
          if ($LASTEXITCODE -ne 0) { throw 'Test restore failed.' }
          dotnet run --project tests/ChristianSpellHelper.Tests/ChristianSpellHelper.Tests.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.value }} -- --core-only --report artifacts/test-reports/ci-core.json
          if ($LASTEXITCODE -ne 0) { throw 'Core checks failed.' }
      - name: Build both architectures
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version '${{ steps.version.outputs.value }}'
      - name: Publish complete prerelease
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $assets = @(Get-ChildItem "artifacts/release/VinceProductivityTray-$version-*-Setup.exe*").FullName
          if ($assets.Count -ne 6) { throw 'Expected two installers, two checksums and two manifests.' }
          $assets += (Resolve-Path "docs/RELEASE-NOTES-$version.md").Path
          $assets += (Resolve-Path 'distribution/README.md').Path
          $assets += (Resolve-Path 'artifacts/test-reports/ci-core.json').Path
          gh release create "v$version" --target '${{ github.sha }}' --title "Vince Productivity Tray $version" --notes-file "docs/RELEASE-NOTES-$version.md" --draft --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          gh release upload "v$version" @assets
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains a draft.' }
          gh release edit "v$version" --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed.' }
